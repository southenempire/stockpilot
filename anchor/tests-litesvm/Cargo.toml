[package]
name = "stockpilot-litesvm-tests"
version = "0.1.0"
edition = "2021"
publish = false
description = "Runs the compiled StockPilot program in LiteSVM to prove the keeper's limits on-chain"

# Standalone: keeps LiteSVM's Solana 3.x crates out of the program's Anchor 0.30 build.
[workspace]

[dev-dependencies]
litesvm = "=0.16.0"
solana-account = "4.3"
solana-address = "2.6"
solana-clock = "3.1"
solana-instruction = "3.4"
solana-keypair = "3.1"
solana-message = "4.2"
solana-signer = "3.0"
solana-transaction = "4.1"
sha2 = "0.10"
